<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>__TITRE__</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --fg: #1d1c19; --muted: #6b6a63; --line: #e2e0d8;
    --accent: #2f7d4f; --chip: #efede6; --read: .55;
    --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121311; --panel: #1a1c19; --fg: #e8e7e1; --muted: #9a9990; --line: #2c2e2a;
      --accent: #5fd08b; --chip: #232521;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121311; --panel: #1a1c19; --fg: #e8e7e1; --muted: #9a9990; --line: #2c2e2a;
    --accent: #5fd08b; --chip: #232521;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15.5px/1.55 var(--sans); }
  a { color: inherit; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 16px 64px; }
  .mono { font-family: var(--mono); }

  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px;
           border-bottom: 1px solid var(--line); padding-bottom: 14px; }
  .prompt { font: 13px var(--mono); color: var(--muted); width: 100%; overflow-wrap: anywhere; }
  .prompt b { color: var(--accent); font-weight: 500; }
  h1 { font: 600 26px/1.2 var(--mono); margin: 0; letter-spacing: -.5px; }
  h1 .cur { display: inline-block; width: .55em; height: 1em; background: var(--accent); vertical-align: -3px;
            margin-left: 4px; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { h1 .cur { animation: none; } }
  .meta { font: 12.5px var(--mono); color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; width: 100%; }
  .meta .num { color: var(--accent); }
  .tools { display: flex; gap: 8px; }
  button, .btn { font: 12.5px var(--mono); color: var(--fg); background: var(--chip); border: 1px solid var(--line);
                 border-radius: 6px; padding: 5px 10px; cursor: pointer; text-decoration: none; }
  button:hover, .btn:hover { border-color: var(--muted); }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .bar { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 12px 0; border-bottom: 1px solid var(--line);
         display: flex; flex-direction: column; gap: 10px; }
  .filters { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 2px; }
  .filters button { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .filters button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
  .filters .n { opacity: .6; }
  .search { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .search input { flex: 1; min-width: 180px; font: 14px var(--mono); color: var(--fg); background: var(--panel);
                  border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; }
  .search label { font: 12.5px var(--mono); color: var(--muted); display: flex; gap: 6px; align-items: center; white-space: nowrap; }

  .une { margin: 22px 0 8px; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--c);
         border-radius: 8px; padding: 20px 22px; }
  .label { font: 12px var(--mono); text-transform: uppercase; letter-spacing: .6px; color: var(--c); }
  .une h2 { font-size: 23px; line-height: 1.3; margin: 6px 0 10px; text-wrap: balance; }
  .une h2 a { text-decoration: none; }
  .une h2 a:hover { text-decoration: underline; }

  section.rub { margin-top: 30px; }
  .rub-head { display: flex; align-items: center; gap: 10px; border-bottom: 2px solid var(--c); padding-bottom: 6px; margin-bottom: 12px; }
  .rub-head h3 { font: 600 15px var(--mono); margin: 0; text-transform: uppercase; letter-spacing: .5px; }
  .rub-head span { font: 12px var(--mono); color: var(--muted); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  @media (max-width: 400px) { .cards { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px;
          display: flex; flex-direction: column; gap: 6px; }
  .card.lu { opacity: var(--read); }
  .tags { font: 11.5px var(--mono); color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 10px; }
  .tags .src { color: var(--fg); }
  .tags .suite { color: var(--c); border: 1px solid var(--c); border-radius: 4px; padding: 0 5px; }
  .card h4 { font-size: 16.5px; line-height: 1.35; margin: 0; }
  .card h4 a { text-decoration: none; }
  .card h4 a:hover { text-decoration: underline; }
  .card p, .une p { margin: 0; }
  .why { color: var(--muted); font-size: 14.5px; }
  .why b { color: var(--fg); font-weight: 600; }
  .links { margin-top: auto; padding-top: 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; font: 12.5px var(--mono); }
  .links a { color: var(--accent); text-decoration: none; }
  .links a:hover { text-decoration: underline; }
  .links button { margin-left: auto; padding: 2px 8px; font-size: 11.5px; }
  .empty { color: var(--muted); font: 13px var(--mono); padding: 30px 0; text-align: center; }

  .archive { margin-top: 44px; border-top: 1px solid var(--line); padding-top: 16px; }
  .archive h3 { font: 600 15px var(--mono); margin: 0 0 10px; }
  details { border-bottom: 1px solid var(--line); padding: 8px 0; }
  summary { cursor: pointer; font: 13px var(--mono); display: flex; gap: 10px; flex-wrap: wrap; }
  summary a { color: var(--accent); }
  details ul { list-style: none; padding: 8px 0 4px; margin: 0; display: grid; gap: 4px; }
  details li { display: flex; gap: 10px; font-size: 14px; align-items: baseline; }
  details li .r { font: 11px var(--mono); color: var(--c); flex: none; width: 92px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 24px; }
  footer { margin-top: 36px; font: 12px var(--mono); color: var(--muted); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="prompt">veille@auto:~$ <b>./veille --edition=<span id="promptDate"></span></b></div>
    <h1>veille_auto<span class="cur" aria-hidden="true"></span></h1>
    <div class="tools">
      <a class="btn" id="homeLink" hidden>dernière édition</a>
      <button type="button" id="themeBtn" aria-label="Changer de thème">clair / sombre</button>
    </div>
    <div class="meta" id="meta"></div>
  </header>

  <div class="bar">
    <div class="filters" id="filters" role="toolbar" aria-label="Filtrer par rubrique"></div>
    <div class="search">
      <input type="search" id="q" placeholder="rechercher dans l'édition…" aria-label="Rechercher dans l'édition">
      <label><input type="checkbox" id="hideRead"> masquer les lus</label>
    </div>
  </div>

  <article class="une" id="une"></article>
  <main id="rubs"></main>
  <p class="empty" id="noResult" hidden>Aucun article ne correspond.</p>

  <nav class="nav" id="nav"></nav>
  <section class="archive">
    <h3>Éditions précédentes</h3>
    <div id="arch"></div>
  </section>
  <footer>Résumés rédigés en français par Claude à partir des flux RSS listés dans config/sources.json. Lisez l'article d'origine pour le détail et les nuances.</footer>
</div>

<script type="application/json" id="data">__DATA__</script>
<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("data").textContent);
  var ed = D.edition, cfg = D.config, TZ = cfg.timezone || "Europe/Paris";
  var RUB = {}; cfg.rubriques.forEach(function (r) { RUB[r.id] = r; });

  function store(k, v) {
    try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; }
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? esc(u) : "#"; }
  function fmt(d, withTime) {
    if (!d) return "";
    if (/^\d{4}-\d{2}-\d{2}$/.test(d)) { d += "T12:00:00Z"; withTime = false; }
    var dt = new Date(d); if (isNaN(dt)) return esc(d);
    var o = { timeZone: TZ, weekday: "short", day: "numeric", month: "short" };
    if (withTime !== false) { o.hour = "2-digit"; o.minute = "2-digit"; }
    try { return dt.toLocaleString("fr-FR", o); } catch (e) { return dt.toISOString().slice(0, 16).replace("T", " "); }
  }
  function color(id) { return (RUB[id] && RUB[id].couleur) || "var(--accent)"; }
  function rubName(id) { return (RUB[id] && RUB[id].nom) || id; }

  // Thème
  var root = document.documentElement, saved = store("va-theme");
  if (saved === "light" || saved === "dark") root.setAttribute("data-theme", saved);
  document.getElementById("themeBtn").addEventListener("click", function () {
    var cur = root.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    var next = cur === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next); store("va-theme", next);
  });

  // Articles lus (propres à ce navigateur)
  var read = {};
  try { read = JSON.parse(store("va-read") || "{}") || {}; } catch (e) { read = {}; }
  function saveRead() {
    var keys = Object.keys(read);
    if (keys.length > 1500) keys.slice(0, keys.length - 1500).forEach(function (k) { delete read[k]; });
    store("va-read", JSON.stringify(read));
  }

  // En-tête
  var items = ed.items || [];
  document.getElementById("promptDate").textContent = ed.date;
  document.title = "veille_auto · n° " + ed.numero + " · " + ed.date;
  document.getElementById("meta").innerHTML =
    '<span class="num">édition n° ' + esc(ed.numero) + '</span><span>' + esc(fmt(ed.date)) + '</span>' +
    '<span>' + (items.length + 1) + ' articles</span>' +
    (ed.genere ? '<span>générée ' + esc(fmt(ed.genere)) + '</span>' : "");
  if (D.nav.accueil) {
    var home = document.getElementById("homeLink"); home.href = D.nav.accueil; home.hidden = false;
  }

  function hnLink(hn) {
    if (!hn || !hn.url) return "";
    return '<a href="' + safeUrl(hn.url) + '" target="_blank" rel="noopener">HN ▲ ' + esc(hn.points) + ' · ' + esc(hn.comments) + ' comm.</a>';
  }
  function readBtn(url) {
    return '<button type="button" class="mark" data-url="' + esc(url) + '" aria-pressed="' + (read[url] ? "true" : "false") + '">' +
      (read[url] ? "lu ✓" : "marquer lu") + '</button>';
  }

  // À la une
  var u = ed.une, uneEl = document.getElementById("une");
  uneEl.style.setProperty("--c", color(u.rubrique));
  uneEl.dataset.rub = u.rubrique; uneEl.dataset.url = u.url;
  uneEl.innerHTML = '<span class="label">À la une · ' + esc(rubName(u.rubrique)) + (u.suite ? " · suite" : "") + '</span>' +
    '<h2><a href="' + safeUrl(u.url) + '" target="_blank" rel="noopener">' + esc(u.titre) + '</a></h2>' +
    '<p>' + esc(u.resume) + '</p>' +
    '<p class="why" style="margin-top:8px"><b>Pourquoi ça compte :</b> ' + esc(u.pourquoi) + '</p>' +
    '<div class="links"><a href="' + safeUrl(u.url) + '" target="_blank" rel="noopener">' + esc(u.source) + ' →</a>' +
    '<span class="tags">' + esc(fmt(u.date)) + '</span>' + hnLink(u.hn) + readBtn(u.url) + '</div>';

  // Rubriques, dans l'ordre de la config
  var groups = {};
  items.forEach(function (a) { (groups[a.rubrique] = groups[a.rubrique] || []).push(a); });
  var order = cfg.rubriques.map(function (r) { return r.id; }).filter(function (id) { return groups[id]; });
  document.getElementById("rubs").innerHTML = order.map(function (id) {
    return '<section class="rub" data-rub="' + esc(id) + '" style="--c:' + esc(color(id)) + '">' +
      '<div class="rub-head"><h3>' + esc(rubName(id)) + '</h3><span>' + groups[id].length + '</span></div><div class="cards">' +
      groups[id].map(function (a) {
        return '<article class="card" data-url="' + esc(a.url) + '">' +
          '<div class="tags"><span class="src">' + esc(a.source) + '</span><span>' + esc(fmt(a.date)) + '</span>' +
          (a.suite ? '<span class="suite">suite</span>' : "") + '</div>' +
          '<h4><a href="' + safeUrl(a.url) + '" target="_blank" rel="noopener">' + esc(a.titre) + '</a></h4>' +
          '<p>' + esc(a.resume) + '</p>' +
          '<p class="why"><b>Pourquoi c\'est intéressant :</b> ' + esc(a.pourquoi) + '</p>' +
          '<div class="links"><a href="' + safeUrl(a.url) + '" target="_blank" rel="noopener">lire l\'article →</a>' +
          hnLink(a.hn) + readBtn(a.url) + '</div></article>';
      }).join("") + '</div></section>';
  }).join("");

  // Filtres, recherche, lus
  var counts = {}; order.forEach(function (id) { counts[id] = groups[id].length; });
  if (counts[u.rubrique] === undefined) { order.unshift(u.rubrique); counts[u.rubrique] = 0; }
  var fEl = document.getElementById("filters");
  fEl.innerHTML = '<button type="button" data-f="*" aria-pressed="true">tout <span class="n">' + (items.length + 1) + '</span></button>' +
    order.map(function (id) {
      return '<button type="button" data-f="' + esc(id) + '" aria-pressed="false"><span class="dot" style="--c:' + esc(color(id)) + '"></span>' +
        esc(rubName(id)) + ' <span class="n">' + (counts[id] + (u.rubrique === id ? 1 : 0)) + '</span></button>';
    }).join("");

  var qEl = document.getElementById("q"), hideEl = document.getElementById("hideRead");
  var filter = store("va-filter") || "*";
  if (filter !== "*" && order.indexOf(filter) < 0) filter = "*";
  hideEl.checked = store("va-hide") === "1";

  function apply() {
    var q = qEl.value.trim().toLowerCase(), hide = hideEl.checked, shown = 0;
    fEl.querySelectorAll("button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.f === filter)); });
    function visible(el, rub) {
      var ok = (filter === "*" || rub === filter) && (!hide || !read[el.dataset.url]) &&
        (!q || el.textContent.toLowerCase().indexOf(q) > -1);
      el.hidden = !ok; el.classList.toggle("lu", !!read[el.dataset.url]);
      if (ok) shown++;
      return ok;
    }
    visible(uneEl, u.rubrique);
    document.querySelectorAll("section.rub").forEach(function (s) {
      var any = false;
      s.querySelectorAll(".card").forEach(function (c) { if (visible(c, s.dataset.rub)) any = true; });
      s.hidden = !any;
    });
    document.getElementById("noResult").hidden = shown > 0;
  }
  fEl.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    filter = b.dataset.f; store("va-filter", filter); apply();
  });
  qEl.addEventListener("input", apply);
  hideEl.addEventListener("change", function () { store("va-hide", hideEl.checked ? "1" : "0"); apply(); });
  document.addEventListener("click", function (e) {
    var b = e.target.closest("button.mark"); if (!b) return;
    var url = b.dataset.url;
    if (read[url]) delete read[url]; else read[url] = 1;
    saveRead();
    document.querySelectorAll("button.mark").forEach(function (m) {
      if (m.dataset.url !== url) return;
      m.setAttribute("aria-pressed", read[url] ? "true" : "false");
      m.textContent = read[url] ? "lu ✓" : "marquer lu";
    });
    apply();
  });
  document.addEventListener("click", function (e) {
    var a = e.target.closest(".card h4 a, .une h2 a"); if (!a) return;
    var host = a.closest("[data-url]"); if (host && !read[host.dataset.url]) { read[host.dataset.url] = 1; saveRead(); apply(); }
  });
  apply();

  // Navigation entre éditions
  var nav = [];
  if (D.nav.precedente) nav.push('<a class="btn" href="' + esc(D.nav.precedente) + '">← édition précédente</a>');
  else nav.push("<span></span>");
  if (D.nav.suivante) nav.push('<a class="btn" href="' + esc(D.nav.suivante) + '">édition suivante →</a>');
  document.getElementById("nav").innerHTML = nav.join("");

  // Archives
  document.getElementById("arch").innerHTML = D.archive.length ? D.archive.map(function (e) {
    return '<details><summary><a href="' + esc(e.href) + '">n° ' + esc(e.numero) + '</a><span>' + esc(fmt(e.date)) + '</span>' +
      '<span style="color:var(--muted)">' + e.items.length + ' liens</span></summary><ul>' +
      e.items.map(function (i) {
        return '<li style="--c:' + esc(color(i.rubrique)) + '"><span class="r">' + esc(rubName(i.rubrique)) + '</span>' +
          '<a href="' + safeUrl(i.url) + '" target="_blank" rel="noopener">' + esc(i.titre) + '</a></li>';
      }).join("") + '</ul></details>';
  }).join("") : '<p class="empty">Première édition : les suivantes s\'archiveront ici.</p>';
})();
</script>
</body>
</html>
